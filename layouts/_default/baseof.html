<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ .Title }}</title>
    <meta name="description" content="{{ .Params.description | default "Free Software Developer" }}">
    <meta name="author" content="Dhruvin Gandhi">

    {{ template "_internal/opengraph.html" . }}

    {{ partial "vanilla-css.html" . }}
  </head>
  <body>
    <header aria-label="Header">
      {{ block "header" . }}
      <h1><a href="{{ .Site.BaseURL }}" style="text-decoration: none">Dhruvin Gandhi</a></h1>
      {{ end }}
    </header>
    <main aria-label="Main">
    {{ block "main" . }}{{ end }}
    </main>
    <footer aria-label="Footer">
      {{ block "footer" . }}
      <section aria-label="Copyright" style="text-align: center; border-top: 1px solid">
        The code is licensed under <a href="https://www.gnu.org/licenses/gpl-3.0.txt">GPL-3.0-or-later</a>, and the articles are licensed under <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>.
      </section>
      {{ end }}
    </footer>
  </body>
</html>
