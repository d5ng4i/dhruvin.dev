image: guix
oauth: pages.sr.ht/PAGES:RW
tasks:
- guix: |
    cd dhruvin.dev
    guix package -v0 -m manifest.scm
- build: |
    cd dhruvin.dev
    make build
- publish: |
    cd dhruvin.dev
    make package
    acurl -f https://pages.sr.ht/publish/dhruvin.dev -Fcontent=@build/site.tar.gz -Fprotocol=HTTPS
    acurl -f https://pages.sr.ht/publish/dhruvin.dev -Fcontent=@build/capsule.tar.gz -Fprotocol=GEMINI
