image: alpine/edge
packages:
- hugo
- hut
- make
- npm
oauth: pages.sr.ht/PAGES:RW
triggers:
- action: email
  condition: failure
  to: contact@dhruvin.dev
tasks:
- deps: |
    cd dhruvin.dev
    make deps
- build: |
    cd dhruvin.dev
    make hugo
- package: |
    cd dhruvin.dev
    make package
- publish: |
    cd dhruvin.dev
    make publish
