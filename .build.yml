image: alpine/edge
packages:
- hugo
- make
oauth: pages.sr.ht/PAGES:RW
tasks:
- build: |
    cd dhruvin.dev
    make hugo
- package: |
    cd dhruvin.dev
    make package
- publish: |
    cd dhruvin.dev
    acurl https://pages.sr.ht/query \
      -Foperations='{ "query": "mutation Publish($domain: String!, $content: Upload!, $siteConfig: SiteConfig) { publish(domain: $domain, content: $content, siteConfig: $siteConfig) { id }}", "variables" : { "domain": "dhruvin.dev", "content": null, "siteConfig": { "notFound": "/404.html" } } }' \
      -Fmap='{ "site": ["variables.content"] }' \
      -Fsite=@site.tar.gz
