image: alpine/latest
packages:
- emacs
- nodejs
- npm
artifacts:
- dhruvin.dev/dist/site.tar.gz
oauth: pages.sr.ht/PAGES:RW
secrets:
- 3f86623d-8605-4062-8a6f-6a395a96fff5
tasks:
- deps: |
    cd dhruvin.dev
    npm ci
- build: |
    cd dhruvin.dev
    BUILD_FLAGS="-l ../deps.el" make build
- publish: |
    cd dhruvin.dev
    make package
    acurl -f https://pages.sr.ht/publish/dhruvin.dev -Fcontent=@dist/site.tar.gz -Fprotocol=HTTPS
    acurl -f https://pages.sr.ht/publish/dhruvin.dev -Fcontent=@dist/capsule.tar.gz -Fprotocol=GEMINI
- pin: |
    cd dhruvin.dev
    DOTENV_CONFIG_PATH=~/.env make pin
