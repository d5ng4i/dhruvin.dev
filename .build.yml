image: alpine/edge
packages:
- hugo
- hut
- make
- npm
secrets:
- ad9e2478-7946-4006-b610-7795e70e7b90
tasks:
- deps: |
    cd dhruvin.dev
    npm ci
- build: |
    cd dhruvin.dev
    make hugo
- package: |
    cd dhruvin.dev
    make package
- publish: |
    cd dhruvin.dev
    hut pages publish site.tar.gz \
      --domain dhruvin.dev \
      --not-found /404.html
