<section aria-label="Webring">
  <div class="columns is-flex">
    <h3 class="column title is-5">Webring</h3>
    <div class="column is-align-self-flex-end has-text-right is-size-7">
      Generated by <a href="https://sr.ht/~sircmpwn/openring">openring</a>
    </div>
  </div>
  <section class="columns" aria-label="Webring Articles">
  {{- range .Articles }}
    <article class="column is-flex is-flex-direction-column" aria-label="Webring Article">
      <a class="is-align-self-flex-start" href="{{ .Link }}">{{ .Title }}</a>
      <p class="is-flex-grow-1">{{ .Summary }}</p>
      <p>via <a href="{{ .SourceLink }}">{{ .SourceTitle }}</a> on {{.Date | datef "January 2, 2006"}}</p>
    </article>
  {{- end }}
  </section>
</section>
